<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipe Studio · Fleet monitor</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;background:#101617;color:#edf3f1}
*{box-sizing:border-box}body{margin:0;padding:52px 30px}main{max-width:1140px;margin:auto}
.eyebrow{color:#87bfb0;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:650}
h1{font-size:32px;letter-spacing:-.025em;margin:12px 0 10px;font-weight:600}
.subtitle,.muted{color:#9daaa6;font-size:14px;line-height:1.7}header{margin-bottom:36px}
.summary{display:flex;gap:46px;padding-bottom:30px;border-bottom:1px solid #2c3734;margin-bottom:28px}
.summary strong{display:block;font-size:29px;line-height:1.5;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:#9daaa6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
article{border:1px solid #303d38;background:#19211f;border-radius:14px;padding:25px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-size:17px;font-weight:600}
.badge{font-size:11px;white-space:nowrap;border-radius:20px;padding:5px 9px;color:#bad0c7;background:#2b3a33}
.badge.running{color:#adf2cf;background:#284d3b}.badge.error{color:#f0bc92;background:#4b3527}
.number{font-size:64px;letter-spacing:-.045em;font-weight:550;line-height:1.25;margin-top:28px;font-variant-numeric:tabular-nums}
.label{color:#a2afa9;font-size:13px}.track{height:5px;border-radius:3px;background:#303b35;margin:25px 0 12px;overflow:hidden}
.bar{height:100%;background:#8ed1af;width:0;transition:width .5s}.progress{font-size:12px;color:#adc1b4;min-height:20px}
.job{font:11px/1.6 Consolas,monospace;color:#84998b;margin-top:25px;overflow-wrap:anywhere;min-height:18px}
.detail{font-size:12px;color:#c2b79b;line-height:1.6;min-height:40px;margin-top:10px;overflow-wrap:anywhere}
.preview-title{font-size:12px;color:#a2afa9;margin:22px 0 9px}
.preview-frame{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/3;border:1px solid #303d38;border-radius:9px;background:#0b100f;overflow:hidden;color:#84998b;font:12px Segoe UI,system-ui,sans-serif;padding:0;cursor:zoom-in}
.preview-frame:disabled{cursor:default}.preview-frame img{display:block;width:100%;height:100%;object-fit:contain}
.preview-frame [hidden]{display:none}.preview-caption{font:10px/1.6 Consolas,monospace;color:#84998b;overflow-wrap:anywhere;min-height:32px;margin-top:9px}
dialog{padding:20px;border:1px solid #3c5145;border-radius:12px;background:#111916;color:#edf3f1;max-width:min(1100px,94vw);max-height:94vh}
dialog::backdrop{background:#000b}dialog img{display:block;max-width:100%;max-height:76vh;object-fit:contain;margin:14px auto}dialog form{display:flex;justify-content:space-between;align-items:center;gap:18px}
dialog button{border:1px solid #526759;border-radius:6px;background:#24352b;color:#edf3f1;padding:7px 13px;cursor:pointer}#preview-name{font-size:12px;overflow-wrap:anywhere}
footer{margin-top:28px;display:flex;gap:24px;justify-content:space-between;color:#85968c;font-size:12px;line-height:1.6}
.notice{color:#e1b38c;min-height:24px;margin-top:15px;font-size:13px}
@media(max-width:820px){body{padding:28px 18px}.cards{grid-template-columns:1fr}.number{font-size:52px}footer{display:block}footer span{display:block;margin-bottom:8px}.summary{gap:24px}}
</style>
<main>
<header><div class="eyebrow">Pipe Studio / Fleet monitor</div><h1>Image generation</h1><div class="subtitle">Camera-matched tapered pipes · Desktop + DGX Spark + AGX</div></header>
<section class="summary" aria-label="Fleet totals"><div><strong id="total">—</strong><span>images completed · latest job per device</span></div><div><strong id="active">—</strong><span>devices generating</span></div></section>
<section class="cards" id="cards" aria-label="Device status" aria-live="polite"></section>
<div class="notice" id="notice"></div>
<footer><span>Read-only · local progress files and SSH · no cloud service</span><span id="updated">Connecting…</span></footer>
</main>
<dialog id="preview-dialog"><form method="dialog"><span id="preview-name"></span><button>Close</button></form><img id="preview-large" alt="Latest generated tapered pipe"></dialog>
<script>
const labels={complete:'Complete',running:'Generating',starting:'Starting',idle:'Idle',prepared:'Prepared',paused:'Paused',failed:'Failed',interrupted:'Interrupted',setup_pending:'Setup pending',unreachable:'Unavailable'};
const elements=new Map();
function addNode(id){
 const card=document.createElement('article');
 card.innerHTML='<div class="top"><span class="name"></span><span class="badge"></span></div><div class="number"></div><div class="label">images completed</div><div class="track"><div class="bar"></div></div><div class="progress"></div><div class="preview-title">Last generated image · click to enlarge</div><button class="preview-frame" disabled><img hidden alt=""><span>Waiting for the first image…</span></button><div class="preview-caption"></div><div class="job"></div><div class="detail"></div>';
 const frame=card.querySelector('.preview-frame'), img=frame.querySelector('img'), placeholder=frame.querySelector('span');
 img.onload=()=>{img.hidden=false;placeholder.hidden=true;frame.disabled=false;};
 img.onerror=()=>{img.hidden=true;placeholder.hidden=false;placeholder.textContent='Preview unavailable; retrying next refresh…';frame.disabled=true;img.dataset.url='';};
 frame.onclick=()=>{const large=document.getElementById('preview-large');large.src=img.src;large.alt=img.alt;document.getElementById('preview-name').textContent=card.querySelector('.name').textContent+' · '+card.querySelector('.preview-caption').textContent;document.getElementById('preview-dialog').showModal();};
 document.getElementById('cards').append(card);elements.set(id,card);return card;
}
function display(data){
 let total=0,active=0;
 for(const n of data.nodes){
  const card=elements.get(n.id)||addNode(n.id), set=(selector,text)=>card.querySelector(selector).textContent=text;
  const known=Number.isFinite(n.completed),completed=known?n.completed:0;
  total+=completed;if(n.running)active++;
  set('.name',n.name);set('.number',known?completed.toLocaleString():'—');
  const badge=card.querySelector('.badge');badge.textContent=n.source_ready&&!n.running&&n.state==='complete'?'Ready':labels[n.state]||n.state;
  badge.className='badge'+(n.running?' running':['failed','unreachable','setup_pending','interrupted'].includes(n.state)?' error':'');
  card.querySelector('.bar').style.width=(n.total?Math.min(100,100*completed/n.total):0)+'%';
  set('.progress',n.total?`${completed.toLocaleString()} / ${n.total.toLocaleString()} planned`:n.ready?'No generation job active':'Waiting for setup');
  set('.job',n.job||'');
  const img=card.querySelector('.preview-frame img'), placeholder=card.querySelector('.preview-frame span');
  if(n.preview){
   if(img.dataset.url!==n.preview.url){img.dataset.url=n.preview.url;img.alt=`Last generated image from ${n.name}: ${n.preview.sample_id}`;img.src=n.preview.url;}
   set('.preview-caption',n.preview.sample_id+(n.preview_stale?' · last available preview':''));
  }else{
   img.hidden=true;img.removeAttribute('src');img.dataset.url='';placeholder.hidden=false;placeholder.textContent=n.preview_stale?'Preview temporarily unavailable':'Waiting for the first image…';card.querySelector('.preview-frame').disabled=true;set('.preview-caption','');
  }
  set('.detail',n.state==='unreachable'?'Connection unavailable. Counts shown are the last known values.':n.detail||n.error||(n.source_ready?'Current environment passed image and label checks.':n.validated?'Images and labels validated.':n.state==='paused'?'Stopped after the current image; ready to resume.':''));
 }
 document.getElementById('total').textContent=data.nodes.some(n=>Number.isFinite(n.completed))?total.toLocaleString():'—';
 document.getElementById('active').textContent=active+' / '+data.nodes.length;
 document.getElementById('updated').textContent=data.updated?'Checked '+new Date(data.updated).toLocaleTimeString()+` · every ${data.interval}s`:'Checking devices…';
 document.getElementById('notice').textContent=data.error||'';
}
async function refresh(){
 try{const response=await fetch('/api/status',{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error();display(await response.json());}
 catch{document.getElementById('notice').textContent='Dashboard connection interrupted. Reopen Fleet Dashboard.cmd to reconnect.';}
}
refresh();setInterval(refresh,15000);
</script>
</html>
